services:
  - type: web
    name: hostel-cleaning-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && cd server && npx prisma generate && npm run build
    startCommand: cd server && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
