name: Deploy website

on:
  push:
    branches: [main]
    paths: ['client/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The committed lockfile is made on Windows and lacks the Linux build binaries (npm/cli#4828), so
      # resolve fresh here. The server workspace runs `prisma generate` on install, which only needs a
      # syntactically valid URL.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: npm run build --workspace=client
        env:
          VITE_BASE: /hostel-room-cleaning/
          # Address of the API; change it under Settings > Secrets and variables > Actions > Variables
          VITE_API_URL: ${{ vars.API_URL }}
      # GitHub Pages answers unknown paths (like /admin on refresh) with 404.html, so reuse the app shell
      - run: |
          cp client/dist/index.html client/dist/404.html
          touch client/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
